<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌎 Pegada Ambiental</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🌎 Pegada Ambiental</h1>
    <p>Descubra o impacto das suas ações no meio ambiente.</p>
</header>

<main>

<div class="container">

    <div class="card">

        <h2>🚗 Transporte Utilizado</h2>

        <select id="transporte">
            <option value="0">Selecione</option>
            <option value="30">Carro</option>
            <option value="20">Moto</option>
            <option value="10">Ônibus</option>
            <option value="5">Bicicleta</option>
        </select>

    </div>

    <div class="card">

        <h2>⚡ Consumo de Energia</h2>

        <select id="energia">
            <option value="0">Selecione</option>
            <option value="30">Alto</option>
            <option value="20">Médio</option>
            <option value="10">Baixo</option>
        </select>

    </div>

    <div class="card">

        <h2>♻️ Reciclagem</h2>

        <select id="reciclagem">
            <option value="0">Selecione</option>
            <option value="5">Sempre Reciclo</option>
            <option value="15">Às vezes</option>
            <option value="30">Nunca</option>
        </select>

    </div>

    <button id="calcular">
        Calcular Pegada Ambiental
    </button>

    <section id="resultado"></section>

</div>

</main>

<footer>
    Projeto Agrinho 2026
</footer>

<script src="script.js"></script>

</body>
</html>
